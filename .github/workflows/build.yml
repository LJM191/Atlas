name: Build and release Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Node.js 20 for nwlink
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ARM toolchain
        uses: numworks/setup-arm-toolchain@latest
      - name: Check NumWorks linker
        run: npx --yes -- nwlink@0.0.16 eadk-cflags
      - name: Build NWA
        run: make clean build
      - name: Upload NWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-NWA
          path: output/app.nwa
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          name: Atlas v0.3.0
          body: |
            Correctif de navigation : ouverture explicite des fiches de formules.
            Nom de l'application simplifié en Atlas, interface recentrée sur les formules,
            et nouvelle icône.
            Application externe EADK pour NumWorks.
          files: output/app.nwa
          fail_on_unmatched_files: true
