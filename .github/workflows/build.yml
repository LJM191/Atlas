name: Build and release NumWorks Ultimate
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Node.js 20 for nwlink
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Show build tool versions
        run: |
          node --version
          npm --version
      - name: Install ARM toolchain
        uses: numworks/setup-arm-toolchain@latest
      - name: Check NumWorks linker
        run: npx --yes -- nwlink@0.0.16 eadk-cflags
      - name: Build NWA
        run: make clean build
      - name: Upload NWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NumWorks-Ultimate-NWA
          path: output/app.nwa
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: NumWorks Ultimate v0.1.0
          body: |
            Première version de NumWorks Ultimate.
            Application externe EADK avec 21 formules STI2D.
          files: output/app.nwa
          fail_on_unmatched_files: true
